<title>Italiano in 30 giorni</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{
  --bg:#F6F3EC; --surface:#FFFFFF; --ink:#1C1B18; --muted:#615C53; --line:#DED8CC;
  --accent:#12559E; --accent-ink:#FFFFFF; --soft:#E7EEF8;
  --plate:#0E7C3F; --plate-ink:#FFFFFF; --plate-line:#0A5A2E;
  --mark:#FFE58A; --mark-ink:#1C1B18;
  --ok:#1E7F4E; --ok-soft:#E1F2E8; --warn:#B42318; --warn-soft:#FBE9E7;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 20px rgba(40,30,10,.08);
  --display:"Jost","Futura","Century Gothic","Helvetica Neue",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --side-w:272px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15171B; --surface:#1E2128; --ink:#ECEDE8; --muted:#A6A9A3; --line:#31353D;
    --accent:#86B4F2; --accent-ink:#0E1A2C; --soft:#1F2B3F;
    --plate:#137F44; --plate-ink:#FFFFFF; --plate-line:#0B5A30;
    --mark:#E9C64A; --mark-ink:#1C1B18;
    --ok:#4FC48C; --ok-soft:#173225; --warn:#F28B82; --warn-soft:#3A1F1D;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15171B; --surface:#1E2128; --ink:#ECEDE8; --muted:#A6A9A3; --line:#31353D;
  --accent:#86B4F2; --accent-ink:#0E1A2C; --soft:#1F2B3F;
  --plate:#137F44; --plate-ink:#FFFFFF; --plate-line:#0B5A30;
  --mark:#E9C64A; --mark-ink:#1C1B18;
  --ok:#4FC48C; --ok-soft:#173225; --warn:#F28B82; --warn-soft:#3A1F1D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0 0 10px}
ul,ol{margin:0 0 10px;padding-left:22px}
li{margin:3px 0}
strong,b{font-weight:600}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* layout */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100%}
.topbar{display:none}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;overflow-x:hidden;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px 30px}
.main{padding-block:28px 80px;padding-inline:24px;min-width:0}
.wrap{max-width:760px;margin:0 auto}
.backdrop{display:none}
@media (max-width:899px){
  .app{display:block}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar .tb-title{font-family:var(--display);font-weight:700;font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .tb-prog{font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
  .side{position:fixed;top:0;left:0;bottom:0;width:min(86vw,330px);height:auto;transform:translateX(-102%);transition:transform .22s ease;z-index:40;padding-top:calc(16px + env(safe-area-inset-top,0px));box-shadow:var(--shadow)}
  .side.open{transform:none}
  .backdrop{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:30}
  .backdrop.show{display:block}
  .main{padding-inline:16px;padding-block:20px 70px}
}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.icon-btn svg{width:22px;height:22px}

/* sidebar */
.brand{display:flex;gap:12px;align-items:center;margin-bottom:14px;text-decoration:none;color:inherit}
.brand-plate{background:var(--plate);color:var(--plate-ink);border:2px solid var(--plate-line);border-radius:6px;font-family:var(--display);font-weight:700;font-size:18px;padding:4px 8px;letter-spacing:.02em}
.brand-t{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1}
.brand-s{font-size:13px;color:var(--muted)}
.progress{margin:6px 0 18px}
.pbar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.pbar span{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.ptext{font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.nav a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);padding:6px 8px;border-radius:6px;font-size:15px;line-height:1.25}
.nav a:hover{background:var(--soft)}
.nav a.active{background:var(--accent);color:var(--accent-ink)}
.nav a.active .n{color:inherit;opacity:.85}
.nav .n{font-family:var(--display);font-weight:600;font-size:14px;width:22px;text-align:right;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.nav .t{flex:1;min-width:0}
.nav .d{width:18px;height:18px;flex:none;color:var(--ok);visibility:hidden}
.nav a.isdone .d{visibility:visible}
.nav a.active .d{color:var(--accent-ink)}
.nav-wk{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 8px 4px}
.nav-wk small{display:block;letter-spacing:0;text-transform:none;font-weight:500;font-size:12px}

/* plate (the green motorway sign) */
.plate{background:var(--plate);color:var(--plate-ink);border:3px solid var(--plate-line);border-radius:10px;padding:14px 20px;display:flex;gap:18px;align-items:center;box-shadow:var(--shadow)}
.plate-num{display:flex;flex-direction:column;align-items:center;line-height:1;flex:none;padding-right:18px;border-right:2px solid var(--plate-line)}
.plate-k{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.plate-n{font-family:var(--display);font-weight:700;font-size:54px;font-variant-numeric:tabular-nums}
.plate h1{font-weight:700;font-size:30px}
.plate p{margin:4px 0 0;font-size:15.5px;opacity:.85}
@media (max-width:520px){.plate{padding:12px 14px;gap:12px}.plate-n{font-size:42px}.plate h1{font-size:24px}}

/* day bar */
.daybar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.timer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.t-time{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;min-width:70px}
.timer.over .t-time{color:var(--warn)}
.t-label{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-family:var(--display);font-weight:600}

/* buttons */
.btn{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.03em;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.btn svg{width:16px;height:16px}
.say{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:50%;cursor:pointer;vertical-align:middle;flex:none;padding:0}
.say svg{width:16px;height:16px}
.say:hover{background:var(--soft)}
.reveal{font-family:var(--display);font-weight:600;font-size:13.5px;letter-spacing:.03em;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:6px;padding:3px 9px;cursor:pointer;margin-top:4px}
.reveal:hover{background:var(--soft)}

/* sections */
.sec{margin-top:34px}
.sec>h2{font-weight:600;font-size:25px;margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec>h2 .en{font-family:var(--body);font-weight:400;font-size:15px;color:var(--muted)}
.chip{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;background:var(--soft);color:var(--accent);border-radius:999px;padding:3px 10px;white-space:nowrap;position:relative;top:-3px}
.goal-list{margin-top:6px}
.plan{display:flex;gap:3px;height:28px;margin:16px 0 6px;border-radius:6px;overflow:hidden}
.plan span{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:12.5px;font-weight:600;color:var(--accent-ink);background:var(--accent);min-width:0;overflow:hidden;white-space:nowrap;letter-spacing:.02em;padding:0 4px}
.plan span:nth-child(even){opacity:.78}
.plan-note{font-size:13px;color:var(--muted)}

/* dialogue */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.scene{font-size:15px;color:var(--muted);font-style:italic;margin-bottom:10px}
.dlg{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.line{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.line.narr{grid-template-columns:1fr}
.line .who{font-family:var(--display);font-weight:600;color:var(--accent);padding-top:3px;min-width:60px;font-size:15.5px}
.line .de{font-size:18px;display:flex;gap:8px;align-items:flex-start}
.line .de span{flex:1}
.line .en{grid-column:2;color:var(--muted);font-size:15px}
.line.narr .en{grid-column:1}
.dlg.hide-en .en{display:none}
.line.playing{background:var(--soft);box-shadow:0 0 0 6px var(--soft);border-radius:6px}
.note{font-size:15px;color:var(--muted)}
.tts-note{display:none;font-size:14px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:6px 10px;margin-bottom:10px}
.tts-note.show{display:block}

/* vocab */
.vg{border-top:1px solid var(--line);margin-top:8px}
.vrow{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.vde{display:flex;gap:8px;align-items:flex-start}
.vde .w{font-weight:600}
.vde .pl{display:block;color:var(--muted);font-size:14px;font-weight:400}
.ven{color:var(--muted);align-self:start;padding-top:2px}
.vg.test .vrow{cursor:pointer}
.vg.test .vrow:not(.show) .ven{visibility:hidden}
.vg.test .vrow:not(.show)::after{content:"tap to reveal";grid-column:2;grid-row:1;justify-self:start;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-family:var(--display);align-self:center}
.vg.test .vrow{position:relative}
.vg.test .vrow:not(.show) .ven{position:absolute;pointer-events:none}

/* grammar */
.gb{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:12px}
.gb h3{font-size:20px;font-weight:600;margin-bottom:8px}
.gb p:last-child{margin-bottom:0}
.scroll{overflow-x:auto;margin:8px 0 10px}
table.tbl{border-collapse:collapse;width:100%;font-size:15.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.tbl th{font-family:var(--display);font-weight:600;background:var(--soft);color:var(--ink);letter-spacing:.02em}
.tbl td.k{font-weight:600}
.ex{margin:6px 0}
.ex .q{margin:0}
.ans{color:var(--ok);font-weight:600;margin-top:2px}
.ans .tr{display:block;color:var(--muted);font-weight:400;font-size:14.5px;margin-top:2px}
.exl{margin-top:6px}
.set{margin-top:16px}
.set h3{font-size:19px;font-weight:600;margin-bottom:4px}
.rule{background:var(--soft);border-radius:8px;padding:10px 14px;margin:10px 0}
.hl{background:var(--soft);padding:0 4px;border-radius:3px}
.warm-list{margin-top:6px}
mark{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:2px}

/* speak, tip, can-do */
.speak-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.tip{border-left:5px solid var(--plate);background:var(--surface);padding:14px 18px;border-radius:0 12px 12px 0;margin-top:34px}
.tip h3{font-size:19px;font-weight:600;margin-bottom:6px}
.tip .k{font-family:var(--display);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cando ul{list-style:none;padding:0}
.cando li{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.cando li svg{width:20px;height:20px;color:var(--ok);flex:none;margin-top:3px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.pager a{font-family:var(--display);font-weight:600;font-size:16px;text-decoration:none}

/* start & appendix pages */
.hero{background:var(--plate);color:var(--plate-ink);border:3px solid var(--plate-line);border-radius:10px;padding:22px 26px;box-shadow:var(--shadow)}
.hero h1{font-size:44px;font-weight:700}
.hero p{font-size:17px;margin:6px 0 0;max-width:36em}
@media (max-width:520px){.hero h1{font-size:34px}.hero{padding:16px 18px}}
.cont{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.cont .big{font-family:var(--display);font-weight:600;font-size:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{font-size:19px;font-weight:600;margin-bottom:4px}
.card .k{font-family:var(--display);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card ol{padding-left:18px;margin:6px 0 0;font-size:15px}
.card a{text-decoration:none}
.callout{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:0 12px 12px 0;padding:14px 18px;margin:16px 0}
.callout h3{font-size:19px;font-weight:600;margin-bottom:6px}
.pron td:first-child{font-weight:600;white-space:nowrap}
.page h2{font-size:26px;font-weight:600;margin:32px 0 10px}
.page h3{font-size:20px;font-weight:600;margin:18px 0 6px}
.phr{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:6px 0;border-bottom:1px solid var(--line)}
.phr .g{display:flex;gap:8px;align-items:flex-start;font-weight:600}
.phr .e{color:var(--muted)}
@media (max-width:520px){.phr{grid-template-columns:1fr}.vrow{grid-template-columns:1fr 1fr}}
/* Italian edition: green motorway-sign plates with a white inner ring */
.plate,.hero{box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),var(--shadow)}
.plate-num{border-right-color:rgba(255,255,255,.75)}
</style>

<div class="page">
  <div class="hero"><div class="plate-k">Italiano · A1</div><h1>Italiano in 30 giorni</h1><p>A complete Italian A1 course in 30 chapters. One chapter a day, 30 minutes each, from "Ciao" to the exam.</p></div>
  <div class="cont"><div><div class="big" id="cont-title">Start with Giorno 1</div><div class="note" id="cont-sub">Your progress is saved in this browser on this device.</div></div><a class="btn" id="cont-btn" href="#day1">Open Giorno 1</a></div>

  <h2>What this book is</h2>
  <p>Thirty chapters, one per day. Each one is planned to fit 30 minutes: a warm-up, a dialogue you can listen to, about 20 new words, one or two grammar points, exercises with hidden answers, and a short speaking task. Days 7, 14, 21 and 30 are review days with a mini test.</p>
  <p>By Giorno 30 you will have met all the grammar and about 600 of the words that the A1 exams expect. CILS A1 (University for Foreigners of Siena), CELI Impatto (Perugia) and PLIDA A1 (Società Dante Alighieri) all certify the same level. At A1 you can introduce yourself, ask and answer simple questions about where you live, people you know and things you have, and handle everyday situations such as the bar, shopping, appointments and transport when people speak slowly and clearly.</p>

  <div class="callout"><h3>Be realistic about the hours</h3>
  <p>Language schools plan 80 to 100 lesson hours for A1. This book gives you 15 hours of focused core work, which is enough to meet all the material once. To make it stick, add 10 to 15 minutes of review on top of the 30 minutes whenever you can: reread yesterday's vocabulary, replay a dialogue, or watch a short street-interview video from a free channel such as <a href="https://www.youtube.com/@EasyItalian" target="_blank" rel="noopener">Easy Italian</a>. If you only ever do the 30 minutes, plan a second pass over the four review days before you take an exam.</p></div>

  <h2>The 30-minute routine</h2>
  <div class="scroll"><table class="tbl">
    <tr><th>Time</th><th>Section</th><th>What to do</th></tr>
    <tr><td class="k">3 min</td><td>Riscaldamento</td><td>Say yesterday's key sentences aloud. Reveal the answers only after you have tried.</td></tr>
    <tr><td class="k">5 min</td><td>Dialogo</td><td>Play it once, read along once, then read both roles aloud yourself.</td></tr>
    <tr><td class="k">7 min</td><td>Vocabolario</td><td>Read each word aloud with its article. Then hide the English and test yourself.</td></tr>
    <tr><td class="k">7 min</td><td>Grammatica</td><td>Read the rule and say every example sentence aloud. Don't memorize tables; use them.</td></tr>
    <tr><td class="k">6 min</td><td>Esercizi</td><td>Write your answers by hand before you reveal them. Writing fixes spelling.</td></tr>
    <tr><td class="k">2 min</td><td>Parlare e scrivere</td><td>Say or write your own sentences. Record yourself on your phone and listen once.</td></tr>
  </table></div>

  <h2>How to get the most out of it</h2>
  <ul>
    <li><b>Speak everything aloud.</b> Italian is written the way it is spoken. Once you know the rules below, you can read any word you see, so let your mouth do the learning.</li>
    <li><b>Learn every noun with its article.</b> Not "tavolo" but "il tavolo, i tavoli". The article carries the gender, and the gender drives the adjectives, the pronouns and even the past tense.</li>
    <li><b>Use the speaker buttons.</b> Every dialogue line and word was recorded with natural Italian voices, so it sounds the same on every device. A day's audio loads the first time you press a speaker button on that day.</li>
    <li><b>Missed a day?</b> Don't double up. Do the next chapter and keep the rhythm.</li>
    <li><b>Mark each day as done.</b> The chapter list shows your progress and the start page always offers the next chapter.</li>
  </ul>

  <h2>Pronunciation crash course</h2>
  <p>Read this once now and come back whenever a word surprises you. Press the speaker to hear each example.</p>
  <div class="scroll"><table class="tbl pron">
    <tr><th>Letters</th><th>Sound</th><th>Examples</th></tr>

<div class="page">
  <div class="hero"><div class="plate-k">Appendice</div><h1>Grammatica in breve</h1><p>Every A1 rule from the book on one page. Use it to look things up, not to memorize.</p></div>

  <h2>1. Articles</h2>
  <div class="scroll"><table class="tbl">
    <tr><th>Before …</th><th>masculine singular</th><th>masculine plural</th><th>feminine singular</th><th>feminine plural</th></tr>
    <tr><td class="k">most consonants</td><td><b>il</b> libro · <b>un</b> libro</td><td><b>i</b> libri</td><td><b>la</b> casa · <b>una</b> casa</td><td><b>le</b> case</td></tr>
    <tr><td class="k">s + consonant, z, ps, gn, y</td><td><b>lo</b> studente · <b>uno</b> studente<br><b>lo</b> zaino · <b>uno</b> zaino</td><td><b>gli</b> studenti, <b>gli</b> zaini</td><td><b>la</b> stazione · <b>una</b> stazione</td><td><b>le</b> stazioni</td></tr>
    <tr><td class="k">a vowel</td><td><b>l'</b>amico · <b>un</b> amico</td><td><b>gli</b> amici</td><td><b>l'</b>amica · <b>un'</b>amica</td><td><b>le</b> amiche</td></tr>
  </table></div>
  <p>Italian uses the definite article more than English: <i>Mi piace <b>il</b> caffè. <b>La</b> domenica dormo. <b>Il</b> signor Rossi è qui.</i> But not when you speak to the person: <i>Buongiorno, signor Rossi!</i></p>

  <h2>2. Nouns and plurals</h2>
  <div class="scroll"><table class="tbl">
    <tr><th>Ending</th><th>Gender</th><th>Plural</th><th>Examples</th></tr>
    <tr><td class="k">-o</td><td>masculine (almost always)</td><td>-i</td><td>il libro → i libri, il ragazzo → i ragazzi</td></tr>
    <tr><td class="k">-a</td><td>feminine (almost always)</td><td>-e</td><td>la casa → le case, la ragazza → le ragazze</td></tr>
    <tr><td class="k">-e</td><td>either, learn it with the article</td><td>-i</td><td>il pane → i pani, la chiave → le chiavi, lo studente → gli studenti</td></tr>
    <tr><td class="k">-ca, -ga</td><td>feminine</td><td>-che, -ghe</td><td>l'amica → le amiche, la riga → le righe</td></tr>
    <tr><td class="k">-co, -go</td><td>masculine</td><td>-chi, -ghi (usually)</td><td>il parco → i parchi, l'albergo → gli alberghi; but l'amico → gli amici, il medico → i medici</td></tr>
    <tr><td class="k">accented vowel, consonant, short forms</td><td>either</td><td>no change</td><td>la città → le città, il caffè → i caffè, il bar → i bar, la foto → le foto, l'auto → le auto</td></tr>
    <tr><td class="k">-ista, -ema, -amma</td><td>masculine in -a</td><td>-i</td><td>il problema → i problemi, il turista → i turisti (la turista → le turiste)</td></tr>
  </table></div>
  <p>Learn the few odd ones: <i>la mano → le mani, l'uomo → gli uomini, l'uovo → le uova, il dito → le dita</i>.</p>

  <h2>3. Adjectives</h2>
  <div class="scroll"><table class="tbl">
    <tr><th></th><th>m. singular</th><th>f. singular</th><th>m. plural</th><th>f. plural</th></tr>
    <tr><td class="k">-o adjectives</td><td>ross<b>o</b></td><td>ross<b>a</b></td><td>ross<b>i</b></td><td>ross<b>e</b></td></tr>
    <tr><td class="k">-e adjectives</td><td>grand<b>e</b></td><td>grand<b>e</b></td><td>grand<b>i</b></td><td>grand<b>i</b></td></tr>
  </table></div>
  <p>Most adjectives come <b>after</b> the noun: <i>una casa grande, un vino rosso</i>. A few short, common ones usually come before: <i>bello, brutto, buono, grande, piccolo, nuovo, vecchio, giovane</i>. Colours and nationalities always follow the noun. <i>Bello</i> and <i>quello</i> before a noun copy the forms of the article: <i>bel libro, bello studente, bell'amico, bella casa, bei libri, begli amici, belle case</i>. <i>Buono</i> copies <i>uno</i>: <i>un buon caffè, una buona pizza, un buono studente</i>.</p>
  <p><b>Comparison:</b> <i>più … di</i> / <i>meno … di</i>: <i>Roma è più grande di Bologna.</i> The superlative adds the article: <i>Venezia è la città più bella d'Italia.</i> Irregular: <i>buono → migliore, cattivo → peggiore</i>; <i>più grande</i> and <i>più piccolo</i> are fine as they are.</p>

  <h2>4. Pronouns and possessives</h2>
  <div class="scroll"><table class="tbl">
    <tr><th>Subject</th><td>io</td><td>tu</td><td>lui / lei / Lei</td><td>noi</td><td>voi</td><td>loro</td></tr>
    <tr><th>Direct object (lo vedo)</th><td>mi</td><td>ti</td><td>lo / la / La</td><td>ci</td><td>vi</td><td>li / le</td></tr>
    <tr><th>Indirect object (gli parlo)</th><td>mi</td><td>ti</td><td>gli / le / Le</td><td>ci</td><td>vi</td><td>gli</td></tr>
    <tr><th>Reflexive (mi lavo)</th><td>mi</td><td>ti</td><td>si</td><td>ci</td><td>vi</td><td>si</td></tr>
    <tr><th>After a preposition (con me)</th><td>me</td><td>te</td><td>lui / lei / Lei</td><td>noi</td><td>voi</td><td>loro</td></tr>
    <tr><th>Possessive (m, f, m pl, f pl)</th><td>mio, mia, miei, mie</td><td>tuo, tua, tuoi, tue</td><td>suo, sua, suoi, sue</td><td>nostro, nostra, nostri, nostre</td><td>vostro, vostra, vostri, vostre</td><td>loro (never changes)</td></tr>
  </table></div>
  <p>Subject pronouns are usually left out, because the verb ending shows the person: <i>Parlo italiano.</i> Object pronouns go <b>before</b> the verb (<i>Lo compro. Ti chiamo domani.</i>) or attach to an infinitive (<i>Voglio comprarlo.</i>). Possessives take the article: <i>il mio libro, la tua casa, i suoi amici</i>, except with one family member in the singular: <i>mio padre, tua sorella, sua moglie</i> (but <i>i miei genitori, il loro padre</i>).</p>

  <h2>5. Present tense</h2>
  <div class="scroll"><table class="tbl">
    <tr><th></th><th>parlare (-are)</th><th>prendere (-ere)</th><th>dormire (-ire)</th><th>finire (-ire with -isc-)</th><th>essere</th><th>avere</th></tr>
    <tr><td class="k">io</td><td>parl<b>o</b></td><td>prend<b>o</b></td><td>dorm<b>o</b></td><td>fin<b>isco</b></td><td>sono</td><td>ho</td></tr>
    <tr><td class="k">tu</td><td>parl<b>i</b></td><td>prend<b>i</b></td><td>dorm<b>i</b></td><td>fin<b>isci</b></td><td>sei</td><td>hai</td></tr>
    <tr><td class="k">lui / lei / Lei</td><td>parl<b>a</b></td><td>prend<b>e</b></td><td>dorm<b>e</b></td><td>fin<b>isce</b></td><td>è</td><td>ha</td></tr>
    <tr><td class="k">noi</td><td>parl<b>iamo</b></td><td>prend<b>iamo</b></td><td>dorm<b>iamo</b></td><td>fin<b>iamo</b></td><td>siamo</td><td>abbiamo</td></tr>
    <tr><td class="k">voi</td><td>parl<b>ate</b></td><td>prend<b>ete</b></td><td>dorm<b>ite</b></td><td>fin<b>ite</b></td><td>siete</td><td>avete</td></tr>
    <tr><td class="k">loro</td><td>parl<b>ano</b></td><td>prend<b>ono</b></td><td>dorm<b>ono</b></td><td>fin<b>iscono</b></td><td>sono</td><td>hanno</td></tr>
  </table></div>
  <p>Common -isc- verbs: <i>finire, capire, preferire, pulire, spedire</i>. Spelling: verbs in -care and -gare keep the hard sound with an h (<i>cerchi, cerchiamo; paghi, paghiamo</i>); verbs in -ciare and -giare do not double the i (<i>cominci, mangi</i>). The present also covers the near future: <i>Domani <b>vado</b> a Roma.</i></p>
  <h3>Irregular verbs you need at A1</h3>
  <div class="scroll"><table class="tbl">
    <tr><th></th><th>andare</th><th>fare</th><th>stare</th><th>dare</th><th>venire</th><th>uscire</th><th>dire</th><th>bere</th><th>sapere</th></tr>
    <tr><td class="k">io</td><td>vado</td><td>faccio</td><td>sto</td><td>do</td><td>vengo</td><td>esco</td><td>dico</td><td>bevo</td><td>so</td></tr>
    <tr><td class="k">tu</td><td>vai</td><td>fai</td><td>stai</td><td>dai</td><td>vieni</td><td>esci</td><td>dici</td><td>bevi</td><td>sai</td></tr>
    <tr><td class="k">lui / lei</td><td>va</td><td>fa</td><td>sta</td><td>dà</td><td>viene</td><td>esce</td><td>dice</td><td>beve</td><td>sa</td></tr>
    <tr><td class="k">noi</td><td>andiamo</td><td>facciamo</td><td>stiamo</td><td>diamo</td><td>veniamo</td><td>usciamo</td><td>diciamo</td><td>beviamo</td><td>sappiamo</td></tr>

  </table></div>

  <h2>6. Modal verbs</h2>
  <div class="scroll"><table class="tbl">
    <tr><th></th><th>potere<br><small>can, may</small></th><th>volere<br><small>want to</small></th><th>dovere<br><small>must, have to</small></th><th>sapere + infinitive<br><small>know how to</small></th></tr>
    <tr><td class="k">io</td><td>posso</td><td>voglio</td><td>devo</td><td>so nuotare</td></tr>
    <tr><td class="k">tu</td><td>puoi</td><td>vuoi</td><td>devi</td><td>sai nuotare</td></tr>
    <tr><td class="k">lui / lei / Lei</td><td>può</td><td>vuole</td><td>deve</td><td>sa nuotare</td></tr>
    <tr><td class="k">noi</td><td>possiamo</td><td>vogliamo</td><td>dobbiamo</td><td>sappiamo nuotare</td></tr>
    <tr><td class="k">voi</td><td>potete</td><td>volete</td><td>dovete</td><td>sapete nuotare</td></tr>
    <tr><td class="k">loro</td><td>possono</td><td>vogliono</td><td>devono</td><td>sanno nuotare</td></tr>
  </table></div>
  <p>The modal verb is followed directly by the infinitive: <i>Devo lavorare. Posso entrare? Vuoi un caffè?</i> For polite requests use <b>vorrei</b> (I would like): <i>Vorrei un cappuccino. Vorrei prenotare una camera.</i></p>

  <h2>7. Reflexive verbs</h2>
  <p><i>alzarsi</i> (to get up): <b>mi</b> alzo, <b>ti</b> alzi, <b>si</b> alza, <b>ci</b> alziamo, <b>vi</b> alzate, <b>si</b> alzano. Common ones: <i>chiamarsi, svegliarsi, alzarsi, lavarsi, vestirsi, sentirsi, riposarsi, divertirsi, sposarsi, trovarsi</i>. The pronoun goes before the verb, or onto the infinitive: <i>Devo alzarmi presto.</i> In the passato prossimo they take <b>essere</b>: <i>Mi sono alzato alle sette. Si è divertita.</i></p>

  <h2>8. Passato prossimo (spoken past)</h2>
  <p><b>avere</b> or <b>essere</b> in the present + past participle: <i>Ho mangiato una pizza. Sono andata a Roma.</i></p>
  <ul>
    <li>Regular participles: -are → -<b>ato</b> (parlato), -ere → -<b>uto</b> (avuto, venduto), -ire → -<b>ito</b> (dormito, finito).</li>
    <li>Irregular: fatto, detto, letto, scritto, preso, visto, messo, aperto, chiuso, bevuto, stato (essere and stare), venuto, nato, morto, rimasto, vissuto, scelto, chiesto, risposto, perso, deciso, offerto, speso, corso, conosciuto, piaciuto, successo, vinto, rotto.</li>
    <li><b>essere</b> with movement and change: andare, venire, arrivare, partire, tornare, entrare, uscire, salire, scendere, cadere, stare, restare, rimanere, essere, nascere, morire, diventare, piacere, succedere, and with every reflexive verb. The participle then agrees with the subject: <i>Marco è andato, Ana è andata, siamo andati, le ragazze sono andate.</i></li>
    <li>With <b>avere</b> the participle does not change: <i>Lei ha mangiato. Loro hanno dormito.</i></li>
    <li>Time words: ieri, l'altro ieri, ieri sera, stamattina, la settimana scorsa, il mese scorso, l'anno scorso, due giorni fa, un'ora fa · <i>già</i> (Ho <b>già</b> mangiato.) · <i>non … ancora</i> (Non ho <b>ancora</b> mangiato.) · <i>non … mai</i> (Non sono <b>mai</b> stato a Roma.)</li>
    <li>There was / there were: <i>c'era, c'erano</i> (<i>C'era molta gente.</i>).</li>
  </ul>

  <h2>9. Prepositions</h2>
  <div class="scroll"><table class="tbl">
    <tr><th></th><th>il</th><th>lo</th><th>l'</th><th>la</th><th>i</th><th>gli</th><th>le</th></tr>
    <tr><td class="k">di (of, from)</td><td>del</td><td>dello</td><td>dell'</td><td>della</td><td>dei</td><td>degli</td><td>delle</td></tr>
    <tr><td class="k">a (to, at, in)</td><td>al</td><td>allo</td><td>all'</td><td>alla</td><td>ai</td><td>agli</td><td>alle</td></tr>
    <tr><td class="k">da (from, at someone's)</td><td>dal</td><td>dallo</td><td>dall'</td><td>dalla</td><td>dai</td><td>dagli</td><td>dalle</td></tr>
    <tr><td class="k">in (in, to)</td><td>nel</td><td>nello</td><td>nell'</td><td>nella</td><td>nei</td><td>negli</td><td>nelle</td></tr>
    <tr><td class="k">su (on)</td><td>sul</td><td>sullo</td><td>sull'</td><td>sulla</td><td>sui</td><td>sugli</td><td>sulle</td></tr>
  </table></div>
  <p><i>con, per, tra/fra</i> do not join the article: <i>con il treno, per la strada, tra due giorni</i>.</p>
  <div class="scroll"><table class="tbl">
    <tr><th>Use</th><th>Examples</th></tr>
    <tr><td class="k">a: cities, fixed places, times</td><td>a Bologna, a casa, a scuola, a letto, a teatro, a piedi · alle otto, a mezzogiorno · al bar, alla stazione, all'università</td></tr>
    <tr><td class="k">in: countries, regions, streets, rooms, shops, vehicles</td><td>in Italia, in Toscana, in via Roma, in cucina, in ufficio, in banca, in farmacia, in centro · in treno, in macchina, in bici · nel parco, nella borsa, negli Stati Uniti</td></tr>
    <tr><td class="k">da: origin, a person's place, since / for</td><td>vengo da Porto, dalla Spagna · vado dal medico, da Marco · da lunedì, da due anni (for two years), dalle 9 alle 17</td></tr>
    <tr><td class="k">di: possession, origin, material</td><td>il libro di Ana, la macchina del professore · sono di Bologna · un bicchiere di vino, una maglia di lana</td></tr>
    <tr><td class="k">partitive (some)</td><td>del pane, dello zucchero, della frutta, dei biscotti, delle mele · or: un po' di pane</td></tr>
    <tr><td class="k">su, con, per, tra</td><td>sul tavolo, sulla sedia · con Marco, con lo zucchero · per te, per due notti, per andare in centro · tra un'ora, fra la banca e il bar</td></tr>
  </table></div>

  <h2>10. c'è, ci sono, piacere</h2>
  <p><b>C'è</b> + singular, <b>ci sono</b> + plural: <i>C'è un bar qui vicino? Ci sono due camere. Non c'è tempo.</i></p>
  <p><b>Piacere</b> works backwards: the thing liked is the subject. <i>Mi piace il caffè.</i> (singular) · <i>Mi piacciono i gelati.</i> (plural) · <i>Mi piace ballare.</i> (verb) · <i>Ti piace? Le piace? (formal, or her) Gli piace? (him, or them)</i> · <i>A Marco piace il calcio. A me sì. A me no. Anche a me. Neanche a me.</i> · Past: <i>Mi è piaciuto il film. Mi sono piaciute le lasagne.</i></p>

  <h2>11. Negation and questions</h2>
  <p><b>non</b> goes before the verb and its pronouns: <i>Non parlo tedesco. Non lo so. Non mi piace.</i> Double negatives are correct: <i>non … mai</i> (never), <i>non … niente / nulla</i> (nothing), <i>non … nessuno</i> (nobody), <i>non … più</i> (no longer), <i>non … ancora</i> (not yet). A yes/no question is the statement with rising intonation: <i>Sei stanco? Parli inglese?</i></p>

  <h2>12. Imperative</h2>
  <div class="scroll"><table class="tbl">
    <tr><th></th><th>parlare</th><th>prendere</th><th>sentire</th><th>finire</th><th>andare</th><th>fare</th><th>essere</th></tr>
    <tr><td class="k">tu</td><td>parla!</td><td>prendi!</td><td>senti!</td><td>finisci!</td><td>vai! (va')</td><td>fai! (fa')</td><td>sii!</td></tr>
    <tr><td class="k">Lei</td><td>parli!</td><td>prenda!</td><td>senta!</td><td>finisca!</td><td>vada!</td><td>faccia!</td><td>sia!</td></tr>
    <tr><td class="k">voi</td><td>parlate!</td><td>prendete!</td><td>sentite!</td><td>finite!</td><td>andate!</td><td>fate!</td><td>siate!</td></tr>
    <tr><td class="k">noi (let's)</td><td>parliamo!</td><td>prendiamo!</td><td>sentiamo!</td><td>finiamo!</td><td>andiamo!</td><td>facciamo!</td><td>siamo!</td></tr>
  </table></div>
  <p>Negative with <i>tu</i>: <b>non</b> + infinitive: <i>Non parlare! Non preoccuparti!</i> Pronouns attach to the tu and voi forms (<i>dimmi, scusami, aspettami, alzati</i>) and go before the Lei form (<i>mi dica, si accomodi</i>). The pairs you will hear every day: <i>Scusa / Scusi · Senti / Senta · Dimmi / Mi dica · Guarda / Guardi · Vai dritto / Vada dritto · Gira a destra / Giri a destra · Prego, si accomodi.</i></p>

  <h2>13. Question words</h2>
  <p>chi (who) · che cosa / cosa / che (what) · dove (where) · di dove (from where: Di dove sei?) · quando (when) · come (how: Come stai? Com'è?) · quanto / quanta / quanti / quante (how much, how many: Quanto costa? Quanti anni hai?) · perché (why, and also because) · quale / quali (which: Qual è il tuo numero?) · che + noun (Che lavoro fai? Che ore sono?) · a che ora (at what time) · da quanto tempo (how long)</p>

  <p>The tens drop their last vowel before <i>uno</i> and <i>otto</i>: ventuno, ventotto, trentuno, quarantotto. Numbers ending in <i>tre</i> take an accent: ventitré, trentatré. <i>Mille</i> becomes <i>-mila</i> in the plural: duemila, diecimila. Prices: 3,50 € = tre euro e cinquanta; 0,90 € = novanta centesimi. Italians write a decimal comma and a thousands dot: 1.250,00 €.</p>
  <h2>Ordinal numbers (dates, floors, streets)</h2>

  <p>Ordinals agree like adjectives: <i>il primo piano, la prima strada, i primi giorni</i>. Dates use plain numbers, except the first of the month: <i>Oggi è il primo maggio. Oggi è il tre ottobre. Il 25 aprile è festa.</i> · <i>Abito al secondo piano.</i> · <i>La seconda strada a sinistra.</i> Written: 03/10/2026 (day/month/year).</p>

    warmup:["Riscaldamento","Warm-up"], dialogue:["Dialogo","Dialogue"], vocab:["Vocabolario","Vocabulary"],
    grammar:["Grammatica","Grammar"], practice:["Esercizi","Practice"], listen:["Ascolto","Listening"], speak:["Parlare e scrivere","Speak and write"]
  };

  /* ---------- storage ---------- */

  };

  function saveDone(){ store.set('i30.done', Object.keys(done).map(Number)); }
  function nextDay(){ for(var i=1;i<=TOTAL;i++){ if(!done[i]) return i; } return TOTAL; }

  /* ---------- speech ---------- */
  var TTS = (function(){
    var ok = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
    var voice = null, loaded = false;
    function load(){
      if(!ok) return;
      var vs = speechSynthesis.getVoices() || [];

      var pref = ['it-IT','it_IT','it-CH','it'];
      for(var p=0;p<pref.length && !voice;p++){
        for(var i=0;i<vs.length;i++){ if((vs[i].lang||'').toLowerCase().indexOf(pref[p].toLowerCase())===0){ voice = vs[i]; break; } }
      }
      /* prefer a natural / online voice when several Italian voices exist */
      var better = vs.filter(function(v){ return /^it/i.test(v.lang||'') && /natural|online|neural|google/i.test(v.name||''); });

    }
    if(ok){ load(); if(typeof speechSynthesis.onvoiceschanged !== 'undefined'){ speechSynthesis.onvoiceschanged = load; } }

      return new Promise(function(res){
        if(!ok){ res(false); return; }
        if(!loaded) load();
        try{ speechSynthesis.cancel(); }catch(e){}
        var u = new SpeechSynthesisUtterance(text);

  })();

  /* ---------- recorded audio: one MP3 sprite per day, cue map in audio/cues.json ---------- */
  var AUDIO = (function(){
    var ctx = null, cues = null, cuesP = null, raw = {}, bufs = {}, decoding = {}, current = null, currentGroup = 'extra';
    function getCtx(){

      if(!ctx) ctx = new AC();
      if(ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} }
      return ctx;
    }
    function loadCues(){
      if(!cuesP) cuesP = fetch('audio/cues.json').then(function(r){ if(!r.ok) throw new Error('no cues'); return r.json(); }).then(function(j){ cues = j; return j; }).catch(function(){ cues = {}; return cues; });
      return cuesP;
    }
    function fetchGroup(g){
      if(!raw[g]) raw[g] = fetch('audio/'+g+'.mp3').then(function(r){ if(!r.ok) throw new Error('no audio'); return r.arrayBuffer(); }).catch(function(e){ delete raw[g]; throw e; });

    }
    function decodeGroup(g){
      if(bufs[g]) return Promise.resolve(bufs[g]);
      if(decoding[g]) return decoding[g];
      var c = getCtx(); if(!c) return Promise.reject(new Error('no audio context'));
      decoding[g] = fetchGroup(g).then(function(ab){ return new Promise(function(res, rej){ c.decodeAudioData(ab.slice(0), res, rej); }); })
        .then(function(b){ bufs[g] = b; delete decoding[g]; return b; })
        .catch(function(e){ delete decoding[g]; throw e; });
      return decoding[g];
    }
    function stop(){ if(current){ try{ current.onended = null; current.stop(); }catch(e){} current = null; } TTS.cancel(); }
    function playClip(g, id){
      return decodeGroup(g).then(function(buf){
        var c = getCtx(), cue = cues[g][id];
        stop();
        return new Promise(function(res){
          var src = c.createBufferSource(); src.buffer = buf; src.connect(c.destination);
          src.onended = function(){ if(current === src) current = null; res(true); };
          current = src; src.start(0, cue[0]/1000, cue[1]/1000);
        });
      });
    }
    /* play a text: the recorded clip when there is one, otherwise the browser's voice */
    function play(text, voiceTag){
      var g = currentGroup; text = VOICES.ttsText(text); voiceTag = voiceTag || 'f1';
      var id = VOICES.key(voiceTag, text);
      return loadCues().then(function(){
        if(cues[g] && cues[g][id]) return playClip(g, id).catch(function(){ return TTS.speak(text, voiceTag); });
        return TTS.speak(text, voiceTag);
      });
    }
    function setGroup(g){ currentGroup = g; loadCues().then(function(){ if(cues[g]) fetchGroup(g).catch(function(){}); }); }
    function hasClips(g){ return loadCues().then(function(){ return !!cues[g] && Object.keys(cues[g]).length > 0; }); }
    return { play:play, stop:stop, setGroup:setGroup, group:function(){ return currentGroup; }, hasClips:hasClips };
  })();
  function sayBtn(text, voiceTag){ return '<button class="say" type="button" data-say="'+esc(text)+'"'+(voiceTag?' data-voice="'+voiceTag+'"':'')+' aria-label="Listen">'+SPK+'</button>'; }
  function ttsNotice(){

  function closeSide(){ $('#side').classList.remove('open'); $('#backdrop').classList.remove('show'); }

  /* ---------- helpers ---------- */
  function exItem(it, idx){

    var q = it[0], a = it[1], tr = it[2];

  }

  function secHead(key, mins, labels){
    var lab = (labels && labels[key]) || META[key];
    return '<h2><span class="chip">'+mins+' min</span>'+esc(lab[0])+' <span class="en">'+esc(lab[1])+'</span></h2>';
  }
  function planBar(mins, order){
    var h = '<div class="plan">';
    order.forEach(function(k){ if(mins[k]>0){ var lab = META[k][0]; var txt = mins[k]>=5 ? esc(lab)+' '+mins[k] : String(mins[k]); h += '<span style="flex:'+mins[k]+' 1 0" title="'+esc(lab)+' '+mins[k]+' min">'+txt+'</span>'; } });
    return h + '</div><div class="plan-note">Minutes for each part of today\'s 30. Start the timer above when you begin.</div>';
  }

  /* ---------- timer ---------- */
  var timer = {left:1800, id:null};
  function fmt(s){ var m = Math.floor(s/60), r = s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
  function timerDraw(){ var t = $('#t-time'); if(t) t.textContent = fmt(timer.left); var b = $('#t-start'); if(b) b.textContent = timer.id ? 'Pause' : (timer.left<1800 && timer.left>0 ? 'Resume' : 'Start'); }
  function timerStop(){ if(timer.id){ clearInterval(timer.id); timer.id = null; } }
  function timerToggle(){
    if(timer.id){ timerStop(); timerDraw(); return; }
    if(timer.left<=0) timer.left = 1800;
    timer.id = setInterval(function(){
      timer.left--;
      if(timer.left<=0){ timer.left = 0; timerStop(); var w = $('#timer'); if(w) w.classList.add('over'); var t=$('#t-time'); if(t) t.textContent = 'Tempo!'; var b=$('#t-start'); if(b) b.textContent='Start'; return; }
      timerDraw();
    }, 1000);
    timerDraw();
  }
  function timerReset(){ timerStop(); timer.left = 1800; var w = $('#timer'); if(w) w.classList.remove('over'); timerDraw(); }

  /* ---------- day page ---------- */
  function renderDay(n){
    var L = LESSONS.filter(function(x){ return x.day===n; })[0];
    if(!L){ renderPage('start'); return; }
    timerReset(); AUDIO.stop();
    var mins = {}; for(var k in DEFAULT_MINS) mins[k] = DEFAULT_MINS[k];
    if(L.mins) for(var k2 in L.mins) mins[k2] = L.mins[k2];
    if(!L.listen) mins.listen = 0;
    var labels = L.labels || {};
    var isDone = !!done[n];
    var h = '';
    h += '<div class="plate"><div class="plate-num"><span class="plate-k">Giorno</span><span class="plate-n">'+n+'</span></div><div class="plate-t"><h1>'+esc(L.title)+'</h1><p>'+esc(L.en)+'</p></div></div>';
    h += '<div class="daybar"><div class="timer" id="timer"><span class="t-label">30 min</span><span class="t-time" id="t-time">30:00</span><button class="btn ghost sm" id="t-start" type="button">Start</button><button class="btn ghost sm" id="t-reset" type="button">Reset</button></div>'
       + '<button class="btn'+(isDone?' done':'')+'" id="btn-done" type="button">'+(isDone?CHK+'Done · click to undo':'Mark day as done')+'</button></div>';
    h += '<section class="sec goals"><h2>Oggi impari <span class="en">Today you will learn</span></h2><ul class="goal-list">'+(L.goals||[]).map(function(g){ return '<li>'+g+'</li>'; }).join('')+'</ul>'+planBar(mins, ['warmup','dialogue','vocab','grammar','practice','listen','speak'])+'</section>';

    if(L.warmup){
      h += '<section class="sec" id="s-warmup">'+secHead('warmup', mins.warmup, labels)+(L.warmup.intro?'<p class="note">'+L.warmup.intro+'</p>':'')+exList(L.warmup.items||[], 'warm-list')+'</section>';
    }
    if(L.dialogue){
      var D = L.dialogue;
      h += '<section class="sec" id="s-dialogue">'+secHead('dialogue', mins.dialogue, labels);
      h += '<h3 style="font-size:20px;font-weight:600;margin-bottom:4px">'+esc(D.title)+'</h3>'+(D.scene?'<p class="scene">'+D.scene+'</p>':'');
      h += '<div class="controls"><button class="btn sm" id="play-all" type="button"><svg><use href="#i-play"/></svg>Play all</button><button class="btn ghost sm" id="tr-toggle" type="button">Hide translation</button></div><div class="tts-note" id="tts-note"></div>';
      h += '<div class="dlg" id="dlg">';
      D.lines.forEach(function(l, idx){
        var who = l[0], de = l[1], en = l[2];
        if(!who){ h += '<div class="line narr"><div class="en" style="font-style:italic">'+esc(de)+(en?' · '+esc(en):'')+'</div></div>'; return; }
        h += '<div class="line" data-i="'+idx+'"><div class="who">'+esc(who)+'</div><div class="de">'+sayBtn(de, VOICES.voiceFor(who))+'<span>'+esc(de)+'</span></div><div class="en">'+esc(en)+'</div></div>';
      });
      h += '</div>'+(D.note?'<p class="note" style="margin-top:8px">'+D.note+'</p>':'')+'</section>';
    }
    if(L.vocab){
      h += '<section class="sec" id="s-vocab">'+secHead('vocab', mins.vocab, labels)+'<div class="controls"><button class="btn ghost sm" id="v-test" type="button">Test me: hide English</button><span class="note">'+L.vocab.length+' words. Say each one aloud, with its article.</span></div><div class="vg" id="vg">';
      L.vocab.forEach(function(v){
        var de = v[0], pl = v.length===3 ? v[1] : '', en = v[v.length-1];
        h += '<div class="vrow"><div class="vde">'+sayBtn(VOICES.vocabText(de, pl))+'<div><span class="w">'+esc(de)+'</span>'+(pl?'<span class="pl">'+esc(pl)+'</span>':'')+'</div></div><div class="ven">'+esc(en)+'</div></div>';
      });
      h += '</div></section>';
    }
    if(L.grammar){
      h += '<section class="sec" id="s-grammar">'+secHead('grammar', mins.grammar, labels);
      L.grammar.forEach(function(g){ h += '<div class="gb"><h3>'+g.h+'</h3>'+g.body+'</div>'; });
      h += '</section>';
    }
    if(L.practice){
      h += '<section class="sec" id="s-practice">'+secHead('practice', mins.practice, labels)+'<p class="note">Write your answers first, then reveal. Where several answers work, the most natural one is shown.</p>';
      L.practice.forEach(function(set){ h += '<div class="set"><h3>'+set.h+'</h3>'+(set.note?'<p class="note">'+set.note+'</p>':'')+exList(set.items)+'</div>'; });
      h += '<div class="controls" style="margin-top:12px"><button class="btn ghost sm reveal-all" type="button" data-target="s-practice">Show all answers</button></div></section>';
    }
    if(L.listen){
      h += '<section class="sec" id="s-listen">'+secHead('listen', mins.listen, labels)+'<p class="note">Press play, listen without reading, and answer. Play it up to three times before you reveal the answer and the transcript.</p><ol class="exl">';
      L.listen.forEach(function(it, i){
        var lv = VOICES.LISTEN_VOICES[i % VOICES.LISTEN_VOICES.length];
        h += '<li class="ex"><div class="controls" style="margin-bottom:4px"><button class="btn sm say-long" type="button" data-say="'+esc(it.text)+'" data-voice="'+lv+'"><svg><use href="#i-play"/></svg>Play</button></div><p class="q">'+it.q+'</p><button class="reveal" type="button">Show answer</button><div class="ans" hidden>'+it.a+'<span class="tr"><b>Transcript:</b> '+esc(it.text)+'</span></div></li>';
      });
      h += '</ol></section>';
    }
    if(L.speak){
      h += '<section class="sec" id="s-speak">'+secHead('speak', mins.speak, labels)+'<div class="speak-box">'+L.speak+'</div></section>';
    }
    if(L.tip){ h += '<aside class="tip"><div class="k">Vivere in Italia</div><h3>'+L.tip.h+'</h3>'+L.tip.body+'</aside>'; }
    if(L.cando){
      h += '<section class="sec cando"><h2>Adesso so … <span class="en">I can now …</span></h2><ul>'+L.cando.map(function(c){ return '<li>'+CHK+'<span>'+c+'</span></li>'; }).join('')+'</ul>';
      h += '<button class="btn'+(isDone?' done':'')+' btn-done2" type="button">'+(isDone?CHK+'Giorno '+n+' done · click to undo':'Mark Giorno '+n+' as done')+'</button></section>';
    }
    var prev = n>1 ? '<a href="#day'+(n-1)+'">← Giorno '+(n-1)+'</a>' : '<a href="#start">← Start</a>';
    var next = n<TOTAL ? '<a href="#day'+(n+1)+'">Giorno '+(n+1)+' →</a>' : '<a href="#grammar">Grammatica in breve →</a>';
    h += '<nav class="pager">'+prev+next+'</nav>';
    $('#main').innerHTML = '<div class="wrap">'+h+'</div>';
    wireDay(L);
  }
  function wireDay(L){
    var n = L.day;
    var ts = $('#t-start'), tr = $('#t-reset');
    if(ts) ts.addEventListener('click', timerToggle);
    if(tr) tr.addEventListener('click', timerReset);
    function toggleDone(){
      if(done[n]) delete done[n]; else done[n] = true;
      saveDone(); updateProgress();
      var d = !!done[n];
      $$('#btn-done, .btn-done2').forEach(function(b){ b.classList.toggle('done', d); });
      var b1 = $('#btn-done'); if(b1) b1.innerHTML = d ? CHK+'Done · click to undo' : 'Mark day as done';
      var b2 = $('.btn-done2'); if(b2) b2.innerHTML = d ? CHK+'Giorno '+n+' done · click to undo' : 'Mark Giorno '+n+' as done';
    }
    $$('#btn-done, .btn-done2').forEach(function(b){ b.addEventListener('click', toggleDone); });
    var pa = $('#play-all'), playing = false, session = 0;
    function markLine(idx){ $$('#dlg .line.playing').forEach(function(x){ x.classList.remove('playing'); }); if(idx!=null){ var el = $('#dlg .line[data-i="'+idx+'"]'); if(el) el.classList.add('playing'); } }
    function stopAll(){ AUDIO.stop(); playing = false; session++; markLine(null); if(pa) pa.innerHTML = '<svg><use href="#i-play"/></svg>Play all'; }
    var dlgEl = $('#dlg'); if(dlgEl) dlgEl.__stopAll = stopAll;
    if(pa) pa.addEventListener('click', function(){
      if(playing){ stopAll(); return; }
      var my = ++session; playing = true; pa.innerHTML = '<svg><use href="#i-stop"/></svg>Stop';
      ttsNotice();
      var i = 0, lines = L.dialogue.lines;
      function next(){
        if(my !== session || !document.body.contains(pa)) return;
        while(i < lines.length && !lines[i][0]) i++;
        if(i >= lines.length){ playing = false; markLine(null); pa.innerHTML = '<svg><use href="#i-play"/></svg>Play all'; return; }
        var l = lines[i], idx = i; i++;
        markLine(idx);
        AUDIO.play(l[1], VOICES.voiceFor(l[0])).then(function(){ if(my !== session) return; setTimeout(next, 400); });
      }
      next();
    });
    var tt = $('#tr-toggle');
    if(tt) tt.addEventListener('click', function(){ var d = $('#dlg'); d.classList.toggle('hide-en'); tt.textContent = d.classList.contains('hide-en') ? 'Show translation' : 'Hide translation'; });
    var vt = $('#v-test');
    if(vt) vt.addEventListener('click', function(){ var g = $('#vg'); g.classList.toggle('test'); $$('.vrow', g).forEach(function(r){ r.classList.remove('show'); }); vt.textContent = g.classList.contains('test') ? 'Show English' : 'Test me: hide English'; });
    ttsNotice();
  }

  /* ---------- static pages ---------- */
  function renderPage(id){
    timerStop(); AUDIO.stop();
    var t = $('#tpl-'+id); if(!t){ t = $('#tpl-start'); id = 'start'; }
    $('#main').innerHTML = '<div class="wrap">'+t.innerHTML+'</div>';
    if(id==='start'){
      var nd = nextDay(), c = doneCount();
      $('#cont-title').textContent = c===0 ? 'Start with Giorno 1' : (c>=TOTAL ? 'All 30 days done. Complimenti!' : 'Continue with Giorno '+nd);
      $('#cont-sub').textContent = c===0 ? 'Your progress is saved in this browser on this device.' : c+' of 30 days done. Your progress is saved in this browser on this device.';
      var b = $('#cont-btn'); b.setAttribute('href', '#day'+(c>=TOTAL?1:nd)); b.textContent = c>=TOTAL ? 'Start again from Giorno 1' : 'Open Giorno '+nd;
      var wc = '';
      WEEKS.forEach(function(w){
        wc += '<div class="card"><div class="k">Settimana '+w.n+'</div><h3>'+esc(w.de)+'</h3><p class="note">'+esc(w.en)+'</p><ol start="'+w.from+'">';
        for(var d=w.from; d<=w.to; d++){ var L = LESSONS.filter(function(x){ return x.day===d; })[0]; wc += '<li><a href="#day'+d+'">'+esc(L?L.title:'')+'</a>'+(done[d]?' ✓':'')+'</li>'; }
        wc += '</ol></div>';
      });
      $('#week-cards').innerHTML = wc;
    }
    if(id==='verbs' && window.VERBS){
      var vh = '<tr><th>Infinito</th><th>lui / lei</th><th>Passato prossimo</th><th>English</th></tr>';
      window.VERBS.forEach(function(v){ vh += '<tr><td class="k">'+sayBtn(VOICES.verbText(v))+' '+esc(v[0])+'</td><td>'+esc(v[1])+'</td><td>'+esc(v[2])+'</td><td>'+esc(v[3])+'</td></tr>'; });
      $('#verb-table').innerHTML = vh;
    }
    if(id==='phrases' && window.PHRASES){
      var ph = '';
      window.PHRASES.forEach(function(group){
        ph += '<h2>'+esc(group.h)+'</h2>';
        group.items.forEach(function(p){ ph += '<div class="phr"><div class="g">'+sayBtn(p[0])+'<span>'+esc(p[0])+'</span></div><div class="e">'+esc(p[1])+'</div></div>'; });
      });
      $('#phrase-list').innerHTML = ph;
    }
  }

  /* ---------- router ---------- */
  function route(){
    var h = (location.hash || '#start').slice(1);
    if(!/^[a-z0-9]+$/i.test(h)) h = 'start';
    var isDay = /^day\d+$/.test(h);
    var r = isDay ? h : ($('#tpl-'+h) ? h : 'start');
    AUDIO.setGroup(isDay ? h : 'extra');
    if(isDay){ renderDay(+h.slice(3)); }
    else { renderPage(h); }
    setActive(r);
    store.set('i30.last', r);
    closeSide();
    window.scrollTo(0,0);
  }

  /* ---------- global events ---------- */
  document.addEventListener('click', function(e){
    var say = e.target.closest('.say, .say-long');
    if(say){ var dl = $('#dlg'); if(dl && dl.__stopAll) dl.__stopAll(); ttsNotice(); AUDIO.play(say.getAttribute('data-say'), say.getAttribute('data-voice') || 'f1'); return; }
    var rv = e.target.closest('.reveal');
    if(rv){ var ans = rv.parentNode.querySelector('.ans'); if(ans){ ans.hidden = !ans.hidden; rv.textContent = ans.hidden ? 'Show answer' : 'Hide answer'; } return; }
    var ra = e.target.closest('.reveal-all');
    if(ra){ var sec = document.getElementById(ra.getAttribute('data-target')); if(sec){ var anyHidden = $$('.ans', sec).some(function(a){ return a.hidden; }); $$('.ans', sec).forEach(function(a){ a.hidden = !anyHidden; }); $$('.reveal', sec).forEach(function(b){ b.textContent = anyHidden ? 'Hide answer' : 'Show answer'; }); ra.textContent = anyHidden ? 'Hide all answers' : 'Show all answers'; } return; }
    var row = e.target.closest('.vrow');
    if(row && row.parentNode.classList.contains('test') && !e.target.closest('.say')){ row.classList.toggle('show'); return; }
  });
  $('#menu-btn').addEventListener('click', function(){ if($('#side').classList.contains('open')) closeSide(); else openSide(); });
  $('#backdrop').addEventListener('click', closeSide);
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSide(); });

  renderNav();
  if(!location.hash){ var last = store.get('i30.last', null); if(last && /^day\d+$/.test(last)) { /* keep start page but hint continues */ } }
  route();
})();
</script>
